[supervisord]
nodaemon=true

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue-worker]
command=php /var/www/html/artisan queue:work --tries=3 --backoff=10 --sleep=3 --max-time=3600
user=www-data
; Supervisor's user= does a raw setuid without resetting $HOME, so this
; process would otherwise inherit root's HOME=/root — and PHP's pgsql driver
; then fails looking for an optional SSL cert under $HOME/.postgresql,
; unable to even read into /root as www-data.
environment=HOME="/var/www"
autostart=true
autorestart=true
; queue:work exits cleanly after --max-time; let supervisor bring it straight back
stopwaitsecs=30
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
