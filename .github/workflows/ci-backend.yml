name: CI — Laravel Backend

on:
  push:
    branches:
      - main
    paths:
      - 'laravel/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'laravel/**'
      - '.github/workflows/ci-backend.yml'
  workflow_dispatch:

jobs:
  lint:
    name: PHP Lint (Pint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: laravel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@c482204203a2eb89366ad513842766b70efaaee8
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, json, pdo, pdo_sqlite, bcmath, fileinfo, tokenizer, zip, gd
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: laravel/vendor
          key: composer-${{ hashFiles('laravel/composer.lock') }}
          restore-keys: |
            composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run Pint (dry-run style check)
        run: ./vendor/bin/pint --test


  test:
    name: PHPUnit Tests

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: laravel

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@c482204203a2eb89366ad513842766b70efaaee8
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, json, pdo, pdo_sqlite, bcmath, fileinfo, tokenizer, zip, gd
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: laravel/vendor
          key: composer-${{ hashFiles('laravel/composer.lock') }}
          restore-keys: |
            composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy .env from .env.example
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run PHPUnit test suite
        run: php artisan test
